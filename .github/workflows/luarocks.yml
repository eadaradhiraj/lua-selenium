name: luarocks

on:
  push:
    tags:
      - "v*"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Upload rockspec
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          if [ -z "$LUAROCKS_API_KEY" ]; then
            echo "Set repository secret LUAROCKS_API_KEY to upload."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          luarocks upload "luaselenium-${TAG}-1.rockspec" --api-key="$LUAROCKS_API_KEY"
